name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openwatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPENWATCH_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/openwatch_test
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run repository checks
        run: sh ops/ci.sh
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run browser checks
        run: npm run test:e2e
        working-directory: frontend
