name: openwatch
x-backend: &backend
  build: ./backend
  restart: unless-stopped
  environment: &env
    DATABASE_URL: postgresql+psycopg://openwatch:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db/openwatch
    ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    COLLECTION_INTERVAL: ${COLLECTION_INTERVAL:-900}
    AI_ENABLED: ${AI_ENABLED:-false}
    OLLAMA_URL: http://ollama:11434
    OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
    AI_BATCH_SIZE: ${AI_BATCH_SIZE:-10}
    AI_TIMEOUT: ${AI_TIMEOUT:-90}
    RETENTION_DAYS: ${RETENTION_DAYS:-90}
    WORKER_TICK_SECONDS: ${WORKER_TICK_SECONDS:-60}
  networks: [internal, egress]
  mem_limit: 768m
  security_opt: [no-new-privileges:true]
services:
  db:
    image: pgvector/pgvector:pg16
    user: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: openwatch
      POSTGRES_DB: openwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [internal]
    mem_limit: 1g
    healthcheck:
      test: [CMD-SHELL, pg_isready -U openwatch -d openwatch]
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    <<: *backend
    restart: 'no'
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
  backend:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *backend
    command: [python, -m, app.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -m, app.healthcheck, worker]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    networks: [internal]
    mem_limit: 512m
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    build: ./ops/proxy
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes: [./ops/Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    networks: [internal, egress]
    mem_limit: 256m
    depends_on:
      frontend: {condition: service_healthy}
    healthcheck:
      test: [CMD, caddy, validate, --config, /etc/caddy/Caddyfile]
      interval: 30s
      timeout: 5s
      retries: 3
  ollama:
    build: ./ops/ollama
    environment:
      OLLAMA_NO_CLOUD: 1
    profiles: [ai]
    restart: unless-stopped
    volumes: [ollama:/models]
    networks: [internal, egress]
    mem_limit: 10g
    healthcheck:
      test: [CMD, ollama, list]
      interval: 30s
      timeout: 10s
      retries: 3
  backup:
    build: ./ops/backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: openwatch
      PGDATABASE: openwatch
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes: [backup_data:/backups]
    networks: [internal]
    mem_limit: 256m
    security_opt: [no-new-privileges:true]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, 'test -f /backups/last-success && test -n "$$(find /backups -name last-success -mmin -1500)"']
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 2m
  prometheus:
    image: prom/prometheus:latest
    profiles: [monitoring]
    restart: unless-stopped
    volumes: [./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro, ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro, prometheus_data:/prometheus]
    networks: [internal]
    mem_limit: 512m
    security_opt: [no-new-privileges:true]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://localhost:9090/-/ready >/dev/null']
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  internal: {internal: true}
  egress: {}
volumes:
  postgres:
  caddy_data:
  caddy_config:
  ollama:
  backup_data:
  prometheus_data:
